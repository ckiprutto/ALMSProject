{% extends "base.html" %}
{% block title %}Rooms Map | ALMS{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
  <div>
    <h2 class="mb-1"><i class="bi bi-geo-alt"></i> Rooms Map</h2>
    <p class="text-muted mb-0">All rooms with registered locations.</p>
  </div>
  <a href="{{ url_for('customer_dashboard') }}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left"></i> Dashboard
  </a>
</div>

<div class="card shadow-sm">
  <div class="card-body p-2">
    <div id="map" style="height: 500px; width: 100%; border-radius: 10px;"></div>
  </div>
</div>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // Initialize map centered on Nairobi
  var map = L.map('map').setView([-1.286389, 36.817223], 13);

  // OSM tiles
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // FIX: access dictionary keys, not tuple indexes
  var rooms = {{ rooms | tojson }};

  var bounds = [];

  rooms.forEach(function(room) {
    var lat = room.latitude;
    var lng = room.longitude;
    var number = room.room_number;
    var price = room.price_per_night;

    if (lat && lng) {
      var marker = L.marker([lat, lng]).addTo(map);
      marker.bindPopup(
        '<b>Room #' + number + '</b><br>Price: KES ' + price + '/night'
      );
      bounds.push([lat, lng]);
    }
  });

  // Auto-fit map to show all markers
  if (bounds.length > 0) {
    map.fitBounds(bounds, { padding: [30, 30] });
  }
</script>

{% endblock %}
